<div id="home-main" class="screen main" #main>
  <div class="content">
    <div class="hello">
      <img src="/assets/new-home/hello.svg" />
    </div>
    <div class="title">
      <div class="headline"><span class="gradient">I'm Amit</span></div> <!--TODO: add animation for entry-->
      <span class="sub-headline">Product Designer</span>
    </div>
    <div class="subtitle">
      <span class="text">
        Enjoying creating awesome design solutions for people who appreciate pixel-perfect design and a genuine love for
        user experience.
      </span>
    </div>
  </div>
  <div class="strip">
    <div class="logo-carousel">
      <div class="logo-track">
        <div class="logo-item" *ngFor="let logo of logoImages">
          <img [src]="logo.src" [alt]="logo.alt" />
        </div>
        <!-- Duplicate logos for seamless infinite scroll -->
        <div class="logo-item" *ngFor="let logo of logoImages">
          <img [src]="logo.src" [alt]="logo.alt" />
        </div>
        <!-- Third set for extra smoothness -->
        <div class="logo-item" *ngFor="let logo of logoImages">
          <img [src]="logo.src" [alt]="logo.alt" />
        </div>
      </div>
    </div>
  </div>
  <div class="right-gradient"></div>
  <div class="left-gradient"></div>
</div>

<div id="home-projects" class="screen projects">
  <div class="column">
    <app-project-item *ngFor="let project of leftColumnProjects"
      [projectName]="project.name"
      [projectImage]="project.image"
      [projectLink]="project.link"
      [title]="project.title"
    ></app-project-item>
  </div>
  
  <div class="column">
    <app-project-item *ngFor="let project of rightColumnProjects"
      [projectName]="project.name"
      [projectImage]="project.image"
      [projectLink]="project.link"
      [title]="project.title"
    ></app-project-item>
  </div>
</div>

<div id="home-contact" class="screen contact" [routerLink]="route" [fragment]="'home-contact'">
  <div class="headline">Thank You</div>
  <div class="subheadline">Let's Talk!</div>
</div>
