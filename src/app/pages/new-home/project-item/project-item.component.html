<div class="project-item"
     [class.animating]="active"
     [class.coming-soon]="comingSoon"
     [class.coming-soon-revealed]="comingSoonRevealed"
     [class.confidential]="isConfidential"
     [class.confidential-revealed]="confidentialRevealed"
     #projectElement
     (click)="onProjectClick($event)">
  <div class="project-image">
    <img [src]="projectImage" alt="{{ projectName }}" loading="lazy" decoding="async" />

    @if (projectBadge) {
      <div class="project-badge"
           [class.badge-new]="projectBadge === 'new'"
           [class.badge-confidential]="projectBadge === 'confidential'"
           [attr.aria-label]="projectBadge === 'new' ? 'New project' : 'Confidential project'">
        @if (projectBadge === 'new') {
          <span>New</span>
        } @else {
          <span class="lock">🔒</span><span>Confidential</span>
        }
      </div>
    }

    @if (comingSoon && !isConfidential) {
      <div class="coming-soon-overlay" aria-hidden="true">
        <div class="coming-soon-badge">
          <svg class="coming-soon-icon" width="22" height="22" viewBox="0 0 24 24" fill="none"
               xmlns="http://www.w3.org/2000/svg">
            <circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="2" />
            <path d="M12 7.5V12L15 14" stroke="currentColor" stroke-width="2"
                  stroke-linecap="round" stroke-linejoin="round" />
          </svg>
          <span>Coming soon</span>
        </div>
      </div>
    }
  </div>
  
  <div class="project-info">
    <div class="name">{{ projectName }}</div>
    <div class="title">
      <div [innerHTML]="title | noBreak"></div>
    </div>
    @if (!comingSoon) {
      <div class="project-link">
          <span class="read-more">View More</span>
          <span class="arrow" aria-hidden="true">
            <svg width="18" height="14" viewBox="0 0 20 14" fill="none" xmlns="http://www.w3.org/2000/svg">
              <line class="arrow-shaft" x1="2" y1="7" x2="11" y2="7" stroke="currentColor"
                    stroke-width="1.4" stroke-linecap="round" />
              <polyline class="arrow-head" points="10,3.5 13.5,7 10,10.5" stroke="currentColor"
                        stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
          </span>
      </div>
    } @else if (isConfidential) {
      <div class="project-link project-link--soon">Confidential</div>
    } @else {
      <div class="project-link project-link--soon">Coming soon...</div>
    }
  </div>
</div>
