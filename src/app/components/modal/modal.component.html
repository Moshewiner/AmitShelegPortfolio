@if (isOpen) {
  <div
    class="modal-backdrop"
    @sheetHost
    (click)="onBackdropClick($event)">
    <!-- Dim layer fades independently so the sheet itself slides without
         fading (iOS-style). pointer-events:none lets taps reach the backdrop. -->
    <div class="modal-dim" @backdropAnimation aria-hidden="true"></div>
    <div
      class="modal-content drawer"
      @drawerAnimation
      (click)="onModalContentClick($event)">
      <div class="drawer-top">
        <div class="drawer-handle" aria-hidden="true"></div>
        <header class="drawer-header">
          <button class="modal-back" type="button" (click)="onClose()" aria-label="Go back">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M14.5 6L9 12L14.5 18" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
          <h2 class="drawer-client">{{ clientName | titleCase }}</h2>
          <!-- Mirrors the back button so the title stays centred. -->
          <span class="drawer-header-spacer" aria-hidden="true"></span>
        </header>
        <div class="drawer-divider" aria-hidden="true"></div>
      </div>
      <div class="modal-body">
        <ng-content></ng-content>
      </div>
    </div>
  </div>
}
