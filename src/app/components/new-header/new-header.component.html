<div class='inner'>
  <div class="menu-items">
    <a class="logo-blur" [href]="'/'" aria-label="Amit Sheleg - Home">
     <img src="assets/new-logo.svg" alt="Amit Sheleg - Home" />
    </a>
  </div>

  <div class="spacer"></div>

  <div class="routing">
    <a class="link projects" (click)="closeMenu()" [routerLink]="'/'" [fragment]="'home-projects'">Projects</a>
    <a class="link about" (click)="closeMenu()" [routerLink]="'/about'">About Me</a>
    <a class="link contact" (click)="closeMenu()" [routerLink]="'/contact'">Contact</a>
  </div>

  <div class="actions">
    <!-- No `download` attribute: the CV should open in a browser tab (see resumeUrl). -->
    <a class="resume-btn" [href]="resumeUrl" target="_blank" rel="noopener noreferrer" (click)="closeMenu()">
      <span class="resume-full">My Resume</span>
      <span class="resume-short">Resume</span>
    </a>
    <button
      type="button"
      class="mobile-menu"
      [class.is-open]="isExpanded"
      [attr.aria-expanded]="isExpanded"
      aria-label="Toggle navigation menu"
      (click)="toggleMenu()">
      <span class="bar bar1"></span>
      <span class="bar bar2"></span>
      <span class="bar bar3"></span>
    </button>
  </div>
</div>
