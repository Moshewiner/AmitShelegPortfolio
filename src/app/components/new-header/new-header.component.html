<div class='inner'>
  <div class="menu-items">
    <a class="logo-blur" [href]="'/'">
      <span class="logo">Amit Sheleg Wainner</span>
    </a>
    <div class="mobile-menu" (click)="toggleMenu()">
      @if (!isExpanded) {
        <img src="assets/humburger.svg" />
      }
      @if (isExpanded) {
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M18 6L6 18M6 6L18 18" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      }
    </div>

  </div>
  <div class="spacer"></div>
  <div class="spacer"></div>
  <div class="spacer"></div>
  <div class="spacer"></div>
  <div class="spacer"></div>
  <div class="spacer"></div>

  <div class="routing">
    <a class="link projects" (click)="closeMenu()" [routerLink]="'/'" [fragment]="'home-my-works'">Projects</a>
    <a class="link about" (click)="closeMenu()" [routerLink]="'/'" [fragment]="'home-about'">About Me</a>
    <a class="link contact" (click)="closeMenu()" [routerLink]="'/'" [fragment]="'home-contact'">Contact</a>
  </div>
</div>
