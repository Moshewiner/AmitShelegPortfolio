<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Amit Sheleg - Portfolio</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="assets/favicon.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preload" as="style"
        href="https://fonts.googleapis.com/css2?family=Imprima&family=Inter+Tight:ital,wght@0,100..900;1,100..900&family=Urbanist:ital,wght@0,100..900;1,100..900&display=swap">
  <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Imprima&family=Inter+Tight:ital,wght@0,100..900;1,100..900&family=Urbanist:ital,wght@0,100..900;1,100..900&display=swap"
        media="print" onload="this.media='all'">
  <noscript>
    <link rel="stylesheet"
          href="https://fonts.googleapis.com/css2?family=Imprima&family=Inter+Tight:ital,wght@0,100..900;1,100..900&family=Urbanist:ital,wght@0,100..900;1,100..900&display=swap">
  </noscript>
</head>
<body>
  <app-root>
    <!-- Instant paint while the app bundle downloads/boots (client-side render).
         Angular replaces this when the root component renders, so the user sees
         a branded splash instead of a blank white screen on slow mobile. -->
    <div class="app-boot" aria-hidden="true">
      <div class="app-boot__spinner"></div>
    </div>
  </app-root>
  <style>
    .app-boot {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #fdfcf9;
    }
    .app-boot__spinner {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      border: 3px solid rgba(253, 81, 41, 0.18);
      border-top-color: #fd5129;
      animation: app-boot-spin 0.8s linear infinite;
    }
    @keyframes app-boot-spin {
      to { transform: rotate(360deg); }
    }
    @media (prefers-reduced-motion: reduce) {
      .app-boot__spinner { animation-duration: 1.6s; }
    }
  </style>
</body>
</html>
